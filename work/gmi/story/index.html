<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  .story { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 1.25rem clamp(1rem, 4vw, 3rem) 1rem; gap: 1rem; }
  .bar { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .bar a:hover, .bar button:hover { color: var(--fg); }
  .bar button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .bar .right { display: flex; gap: 1.1rem; }
  .body { display: grid; grid-template-columns: minmax(16rem, 23rem) 1fr; gap: clamp(1.5rem, 4vw, 3.5rem); align-items: center; min-height: 0; }

  /* caption */
  .cap { position: relative; min-height: 15rem; }
  .cap .step { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .cap h1 { font-family: var(--hand); font-weight: 400; font-size: 17px; line-height: 1.5; margin: 0.9rem 0 0.8rem; }
  .cap p { color: var(--muted); }
  .cap p + p { margin-top: 0.8em; }
  .cap p strong { color: var(--fg); font-weight: 500; }
  .cap .in { transition: opacity .35s ease, transform .35s ease; }
  .cap .in.out { opacity: 0; transform: translateY(6px); }

  /* stage */
  .stagewrap { min-height: 0; height: 100%; display: grid; place-items: center; }
  .stage {
    position: relative; width: min(100%, calc((100vh - 9rem) * 1.546)); aspect-ratio: 2400 / 1552;
    background: #E6E7EB; border-radius: 12px; overflow: hidden; container-type: inline-size;
    font-family: "Inter", system-ui, sans-serif; color: #1C1D21;
  }
  .t, .dot, .cell, .seg, .rl {
    position: absolute; transition-property: left, top, width, height, opacity, background-color, border-radius, color;
    transition-duration: .9s; transition-timing-function: cubic-bezier(.6,.05,.25,1);
  }
  .t { border-radius: 1.2cqi; background: #fff; overflow: hidden; }
  .t .in { position: absolute; inset: 0; padding: 1.4cqi 1.6cqi; display: flex; flex-direction: column; transition: opacity .3s ease; }
  .t .in.fade { opacity: 0; }
  .lab { font-size: 1.15cqi; font-weight: 600; letter-spacing: .01em; opacity: .75; }
  .q { font-size: 1.25cqi; line-height: 1.35; opacity: .7; margin-top: .4cqi; }
  .big { font-size: 5.2cqi; font-weight: 700; line-height: 1; letter-spacing: -.02em; margin-top: auto; }
  .huge { font-size: 13cqi; font-weight: 700; line-height: .9; letter-spacing: -.04em; }
  .mid { margin: auto 0; }
  .ctr { align-items: center; justify-content: center; text-align: center; }
  .sub { font-size: 1.35cqi; opacity: .85; margin-top: .9cqi; }
  .ai { font-size: 1cqi; font-weight: 600; color: #7B3FE4; }
  .ai::before { content: "✦ "; }
  .card-t { font-size: 1.5cqi; font-weight: 600; margin: .6cqi 0 .4cqi; }
  .card-p { font-size: 1.25cqi; line-height: 1.4; opacity: .8; }
  .dot { border-radius: 50%; background: #9BA0AB; }
  .cell { border-radius: .35cqi; }
  .seg { border-radius: 1cqi; color: #fff; overflow: hidden; }
  .seg .in { position: absolute; inset: 0; padding: 1.1cqi .9cqi; display: flex; flex-direction: column; transition: opacity .3s ease; }
  .seg .pct { font-size: 3.4cqi; font-weight: 700; margin-top: auto; line-height: 1; }
  .seg .nm { font-size: 1.05cqi; font-weight: 600; line-height: 1.25; }
  .rl { font-size: 1cqi; color: #5b5f69; white-space: nowrap; }
  .bars { margin-top: .8cqi; display: grid; gap: .8cqi; }
  .bars div { display: grid; grid-template-columns: 11cqi 1fr 3cqi; align-items: center; gap: .8cqi; font-size: 1.05cqi; }
  .bars i { display: block; height: 1cqi; border-radius: 1cqi; background: #E4E5EA; position: relative; overflow: hidden; }
  .bars i b { position: absolute; inset: 0 auto 0 0; border-radius: 1cqi; background: var(--c, #5B6475); transition: width 1s cubic-bezier(.6,.05,.25,1) .3s; }
  .bullet { position: relative; height: 3.4cqi; margin-top: 2cqi; }
  .bullet .bands { position: absolute; inset: 0; display: flex; border-radius: .4cqi; overflow: hidden; }
  .bullet .bands span:nth-child(1) { flex: 60; background: #F6D2CE; }
  .bullet .bands span:nth-child(2) { flex: 15; background: #F8E7B3; }
  .bullet .bands span:nth-child(3) { flex: 25; background: #CDEBC8; }
  .bullet .val { position: absolute; left: 0; top: 33%; height: 34%; width: 0; background: #2F55E4; border-radius: .3cqi; transition: width 1.2s cubic-bezier(.6,.05,.25,1) .4s; }
  .bullet .mark { position: absolute; top: -18%; height: 136%; width: .35cqi; background: #F5A300; left: 70%; }
  .bullet-legend { display: flex; justify-content: space-between; font-size: 1cqi; opacity: .7; margin-top: .6cqi; }
  .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s ease; }
  .shot.on { opacity: 1; }
  .logo { position: absolute; left: 1.8%; top: 2.4%; height: 8.5%; opacity: 0; transition: opacity .6s ease; }

  /* progress */
  .prog { display: flex; gap: 6px; }
  .prog button { flex: 1; height: 3px; border: 0; padding: 0; border-radius: 3px; background: var(--faint); cursor: pointer; position: relative; overflow: hidden; }
  .prog button.done { background: var(--muted); }
  .prog button.cur { background: var(--fg); }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: .75rem; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .nav button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: .2rem 0; }
  .nav button:hover { color: var(--fg); }
  .nav .hint { opacity: .8; }

  @media (max-width: 860px) {
    body { overflow: auto; }
    .story { height: auto; min-height: 100%; }
    .body { grid-template-columns: 1fr; }
    .stagewrap { order: -1; }
    .stage { width: 100%; }
    .cap { min-height: 13rem; }
    .nav .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .t, .dot, .cell, .seg, .rl, .shot, .bars i b, .bullet .val { transition-duration: .01s !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<div class="story">
  <div class="bar">
    <a href="/work/gmi/">← GMI case study</a>
    <div class="right"><button id="auto" type="button">Autoplay</button><button class="theme" type="button" aria-label="Switch colour theme">Dark</button></div>
  </div>

  <div class="body">
    <div class="cap" aria-live="polite"><div class="in" id="cap"></div></div>
    <div class="stagewrap"><div class="stage" id="stage" role="img" aria-label="Animated diagram for the current step"></div></div>
  </div>

  <div>
    <div class="prog" id="prog"></div>
    <div class="nav"><button id="prev" type="button">← Prev</button><span class="hint">Use ← → or scroll</span><button id="next" type="button">Next →</button></div>
  </div>
</div>

<script>
(function () {
  /* ---------------- Colours ---------------- */
  var RED = '#E30613', GREY = '#D9DBE1', YEL = '#FFE7A6', WHITE = '#FFFFFF';
  var SEGC = ['#FF7A2F', '#FFB020', '#00B4E0', '#19A824'];

  /* ---------------- Layouts (x, y, w, h in % of the stage) ---------------- */
  // Final cockpit, measured from the real screen
  var F = {
    c1: [1.8, 13.5, 24.6, 18.3], c2: [27.4, 13.5, 24.6, 18.3], c3: [53.0, 13.5, 24.6, 18.3], c4: [78.6, 13.5, 9.3, 18.3], c5: [88.9, 13.5, 9.3, 18.3],
    cult: [1.8, 33.4, 24.7, 41.4], mes: [27.5, 33.4, 45.1, 41.4], ret: [73.5, 33.4, 24.7, 41.4],
    eng: [1.8, 76.3, 31.5, 15.9], men: [34.2, 76.3, 31.5, 15.9], lead: [66.7, 76.3, 31.5, 15.9]
  };
  // Information-design map (the planning layout)
  var M = {
    c1: [2, 3, 22.75, 16], c2: [26.42, 3, 22.75, 16], c3: [50.83, 3, 22.75, 16], c4: [75.25, 3, 22.75, 16], c5: [75.25, 3, 22.75, 16],
    cult: [2, 21, 22, 47], mes: [26, 21, 48, 47], ret: [76, 21, 22, 47],
    eng: [2, 70, 31.33, 27], men: [34.33, 70, 31.33, 27], lead: [66.67, 70, 31.33, 27]
  };
  var CENTER = [42, 40, 16, 20];
  var FULL = [6, 8, 88, 84];

  /* ---------------- Build the stage ---------------- */
  var stage = document.getElementById('stage');
  function el(cls, parent) { var d = document.createElement('div'); d.className = cls; (parent || stage).appendChild(d); return d; }
  function place(node, r) { node.style.left = r[0] + '%'; node.style.top = r[1] + '%'; node.style.width = r[2] + '%'; node.style.height = r[3] + '%'; }

  var logo = document.createElement('img'); logo.className = 'logo'; logo.src = '/logos/gmi.webp'; logo.alt = ''; stage.appendChild(logo);

  // Survey "data" dots
  var dots = [];
  var seed = 7; function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var i = 0; i < 70; i++) {
    var d = el('dot'); var s = 1 + rnd() * 1.6;
    d._home = [4 + rnd() * 90, 6 + rnd() * 86, s, s * 1.546];
    d.style.background = ['#9BA0AB', '#B7BBC4', '#7E8492', RED][Math.floor(rnd() * 3.3)];
    d.style.transitionDelay = (rnd() * 0.35).toFixed(2) + 's';
    dots.push(d);
  }

  // Main tiles
  var T = {};
  ['c1', 'c2', 'c3', 'c4', 'c5', 'cult', 'mes', 'ret', 'eng', 'men', 'lead'].forEach(function (k) {
    var t = el('t'); t._in = el('in', t); T[k] = t;
  });

  // Distribution segments (out of the score)
  var SEGN = ['Emerging performers', 'Developing performers', 'Proven contributors', 'Star performers'];
  var SEGP = [18, 28, 44, 10];
  var segs = SEGN.map(function (n, i) {
    var s = el('seg'); s.style.background = SEGC[i];
    var inn = el('in', s); inn.innerHTML = '<span class="nm">' + n + '</span><span class="pct">' + SEGP[i] + '%</span>';
    return s;
  });
  function segRects(area) {
    var gap = 1, w = area[2] - gap * 3, x = area[0];
    return SEGP.map(function (p) { var r = [x, area[1], w * p / 100, area[3]]; x += w * p / 100 + gap; return r; });
  }

  // Heatmap: roles x regions
  var ROWS = ['President', 'SVP', 'VP', 'General Manager', 'Senior Manager', 'Manager'];
  var COLS = ['AP', 'AR', 'AS', 'BH', 'CH', 'GJ', 'HR', 'HP', 'KA', 'KL', 'MH', 'TN'];
  var GREENS = ['#E3F5E1', '#BFE8BA', '#8ED487', '#4DBA43', '#1E9A1A'];
  var cells = [], rlabels = [], clabels = [];
  seed = 3;
  for (var r = 0; r < ROWS.length; r++) for (var c = 0; c < COLS.length; c++) {
    var cl = el('cell'); var v = rnd(); cl._g = GREENS[v < .3 ? 0 : v < .55 ? 1 : v < .75 ? 2 : v < .9 ? 3 : 4];
    cl._r = r; cl._c = c; cl.style.background = '#19A824';
    cl.style.transitionDelay = ((r + c) * 0.025).toFixed(3) + 's';
    cells.push(cl);
  }
  ROWS.forEach(function (n) { var l = el('rl'); l.textContent = n; rlabels.push(l); });
  COLS.forEach(function (n) { var l = el('rl'); l.textContent = n; l.style.textAlign = 'center'; clabels.push(l); });
  function grid(area, labels) {
    var lw = labels ? 9 : 0, lh = labels ? 4 : 0, gx = .5, gy = .8;
    var x0 = area[0] + lw, y0 = area[1] + lh, w = area[2] - lw, h = area[3] - lh;
    var cw = (w - gx * (COLS.length - 1)) / COLS.length, ch = (h - gy * (ROWS.length - 1)) / ROWS.length;
    return {
      cell: function (r, c) { return [x0 + c * (cw + gx), y0 + r * (ch + gy), cw, ch]; },
      row: function (r) { return [area[0], y0 + r * (ch + gy) + ch / 2 - 1.2, lw - 1, 2.4]; },
      col: function (c) { return [x0 + c * (cw + gx), area[1], cw, 3]; }
    };
  }

  // Final screenshots
  var SHOTS = ['cockpit', 'mes-explorer', 'culture-explorer', 'retention-explorer', 'star-performers'];
  var shots = SHOTS.map(function (n) {
    var im = document.createElement('img'); im.className = 'shot'; im.src = '/work-media/gmi/' + n + '.webp'; im.alt = ''; im.loading = 'lazy'; stage.appendChild(im); return im;
  });

  /* ---------------- Tile content helpers ---------------- */
  function H(lab, q, big, extra) { return (lab ? '<span class="lab">' + lab + '</span>' : '') + (q ? '<span class="q">' + q + '</span>' : '') + (big ? '<span class="big">' + big + '</span>' : '') + (extra || ''); }
  function bars(rows, colour) {
    return '<div class="bars">' + rows.map(function (r) { return '<div><span>' + r[0] + '</span><i><b style="width:' + r[1] + '%;--c:' + colour + '"></b></i><span>' + r[1] + '</span></div>'; }).join('') + '</div>';
  }
  var BULLET = '<div class="bullet"><div class="bands"><span></span><span></span><span></span></div><div class="val"></div><div class="mark"></div></div><div class="bullet-legend"><span>Below industry</span><span>Average</span><span>Above</span></div>';

  /* ---------------- Scenes ---------------- */
  // Each scene: caption + a function that sets the stage.
  var scenes = [
    {
      t: 'a lot of answers', cap: '<p>Every year, companies ask their employees how their managers are doing. In the design’s sample data that’s <strong>344 managers</strong> and <strong>1,245 people</strong> answering dozens of questions each.</p><p>Great Manager Institute’s job is to turn all of that into something a leadership team can act on.</p>',
      set: function () { dots.forEach(function (d) { place(d, d._home); d.style.opacity = 1; }); }
    },
    {
      t: 'one metric that matters the most', cap: '<p>Leaders don’t want forty charts. They want one answer: <strong>how effective are our managers, and how do we compare with the industry?</strong></p><p>So everything starts from a single number, the Managerial Effectiveness Score.</p>',
      set: function () {
        dots.forEach(function (d) { place(d, [48.5, 46, 3, 4.6]); d.style.opacity = 0; });
        show('mes', FULL, RED, '<div class="in ctr" style="color:#fff"><span class="lab" style="opacity:.9">Managerial Effectiveness Score</span><span class="huge" style="margin:1.5cqi 0">82</span><span class="sub">12 points above the industry benchmark</span></div>');
      }
    },
    {
      t: 'information design', cap: '<p>Then the layout. <strong>Every block answers one question</strong>, in the order a leader asks it.</p><p>The score sits in the middle. The things that shape it sit around it: culture, retention, engagement, mentorship and leadership, each compared with the industry. Quick facts and AI summaries go on top.</p>',
      set: function () {
        show('c1', M.c1, GREY, H('', '12 of 344 managers are in the top 100'));
        show('c2', M.c2, GREY, H('', '30% of your managers beat the industry average'));
        show('c3', M.c3, GREY, H('', 'AI summary of what people wrote'));
        show('c4', M.c4, GREY, H('', 'How the score relates to performance'));
        show('cult', M.cult, GREY, H('Culture', 'How am I doing compared with the industry?'));
        show('mes', M.mes, RED, '<div class="in ctr" style="color:#fff"><span class="lab" style="opacity:.9">Managerial Effectiveness Score</span><span class="q" style="opacity:.85">Gauge or bullet graph</span></div>');
        show('ret', M.ret, GREY, H('Retention', 'How am I doing compared with the industry?'));
        show('eng', M.eng, YEL, H('Engagement', 'Company score against the industry benchmark'));
        show('men', M.men, YEL, H('Mentorship', 'How am I doing compared with the industry?'));
        show('lead', M.lead, YEL, H('Leadership', 'How am I doing compared with the industry?'));
      }
    },
    {
      t: 'how am i doing?', cap: '<p>For each factor the answer is a <strong>bullet graph</strong>: one bar for your score, a marker for the industry benchmark, and colour bands behind it for below, average and above.</p><p>It’s compact and made for exactly this: one value, compared with one benchmark.</p>',
      set: function () {
        ['c1', 'c2', 'c3', 'c4', 'cult', 'mes', 'eng', 'men', 'lead'].forEach(function (k) { T[k].style.opacity = .25; });
        show('ret', [20, 18, 60, 64], WHITE, H('Manager retention', 'Your company against the industry benchmark', '', BULLET + '<span class="big" style="color:#2F55E4">90</span><span class="sub" style="color:#19A824">12 points above the industry benchmark</span>'));
        setTimeout(function () { var v = T.ret.querySelector('.val'); if (v) v.style.width = '90%'; }, 420);
      }
    },
    {
      t: 'how are managers distributed?', cap: '<p>Click the score and it opens up. <strong>Who is driving that 82?</strong></p><p>Managers fall into four groups, from emerging performers to star performers, with the change since the last survey right beside them.</p>',
      set: function () {
        show('c1', [2, 3, 30.67, 15], GREY, H('', 'Overview of the survey'));
        show('c3', [34.67, 3, 30.67, 15], GREY, H('', 'Action on the written answers'));
        show('c4', [67.33, 3, 30.67, 15], GREY, H('', 'Insight based on this page'));
        var area = [2, 21, 74, 47];
        var R = segRects(area); segs.forEach(function (s, i) { place(s, R[i]); s.style.opacity = 1; });
        show('ret', [78, 21, 20, 47], YEL, H('Last survey', 'How was this last year?', '', '<span class="sub" style="margin-top:auto;line-height:1.7">Star performers ↑ 7%<br>Proven contributors ↓ 3%<br>Developing ↑ 3%<br>Emerging ↑ 3%</span>'));
        show('eng', M.eng, YEL, H('Engagement', 'How am I doing compared with the industry?'));
        show('men', M.men, YEL, H('Mentorship', 'How am I doing compared with the industry?'));
        show('lead', M.lead, YEL, H('Leadership', 'How am I doing compared with the industry?'));
      }
    },
    {
      t: 'who are these people, and where?', cap: '<p>Pick a group, say the <strong>star performers</strong>, and dive into the individual cohorts: every level, every region.</p><p>The darker the square, the more of that cohort are star performers.</p>',
      set: function () {
        show('c1', [2, 3, 47, 15], WHITE, H('Star performers', '', '', '<span class="sub" style="margin-top:auto">Score 95 · 34 managers</span>'));
        show('c3', [51, 3, 47, 15], WHITE, H('', 'Home / Explorer MES / Focus: Star performers'));
        segs.forEach(function (s, i) { place(s, i === 3 ? [2, 21, 96, 76] : [2, 21, .1, 76]); s.style.opacity = i === 3 ? .0 : 0; });
        var g = grid([3, 22, 94, 74], true);
        cells.forEach(function (cl) { place(cl, g.cell(cl._r, cl._c)); cl.style.opacity = 1; cl.style.background = cl._g; });
        rlabels.forEach(function (l, r) { place(l, g.row(r)); l.style.opacity = 1; });
        clabels.forEach(function (l, c) { place(l, g.col(c)); l.style.opacity = 1; });
      }
    },
    {
      t: 'why they stand out', cap: '<p>Then the why. Under the map, the page shows what <strong>drives</strong> star performers, what <strong>holds them back</strong>, and where they’ve <strong>gained</strong> most since last time.</p><p>Balanced work and care for the individual lead. Feedback sharing lags, but it’s also the biggest gainer.</p>',
      set: function () {
        show('c1', [2, 3, 47, 15], WHITE, H('Star performers', '', '', '<span class="sub" style="margin-top:auto">Score 95 · 34 managers</span>'));
        show('c3', [51, 3, 47, 15], WHITE, H('', 'Home / Explorer MES / Focus: Star performers'));
        var g = grid([3, 21, 94, 43], true);
        cells.forEach(function (cl) { place(cl, g.cell(cl._r, cl._c)); cl.style.opacity = 1; cl.style.background = cl._g; });
        rlabels.forEach(function (l, r) { place(l, g.row(r)); l.style.opacity = 1; });
        clabels.forEach(function (l, c) { place(l, g.col(c)); l.style.opacity = 1; });
        show('eng', [2, 67, 31.33, 30], WHITE, H('Drivers', '', '', bars([['Balanced work', 93], ['Care for individual', 92], ['Respectful', 90]], '#5B6475')));
        show('men', [34.33, 67, 31.33, 30], WHITE, H('Detractors', '', '', bars([['Feedback sharing', 34], ['Collaboration', 35], ['Decisions', 36]], '#E5484D')));
        show('lead', [66.67, 67, 31.33, 30], WHITE, H('Top gainers', '', '', bars([['Feedback sharing', 88], ['Collaboration', 58], ['Decisions', 36]], '#19A824')));
      }
    },
    {
      t: 'ai on top', cap: '<p>Nobody reads a thousand written comments. <strong>AI reads them</strong> and turns them into a few insights at the top of every page, each one tied to the numbers below it.</p>',
      set: function () {
        show('c1', M.c1, WHITE, H('MES correlation with performance', '', '', '<span class="sub" style="margin-top:auto">A strong, positive relationship</span>'));
        show('c2', [26.42, 3, 35.6, 16], WHITE, '<span class="ai">Powered by AI</span><span class="card-t">Retention boost</span><span class="card-p">Teams with an MES of 85% or higher are 20% more likely to retain their top performers.</span>');
        show('c3', [63.02, 3, 34.98, 16], WHITE, '<span class="ai">Powered by AI</span><span class="card-t">Recurring sentiments</span><span class="card-p">Feedback on respectfulness is overwhelmingly positive, from 85% of employees.</span>');
        var L = { cult: H('Culture'), mes: '<div class="in ctr" style="color:#fff"><span class="lab" style="opacity:.9">Managerial Effectiveness Score</span></div>', ret: H('Retention'), eng: H('Engagement'), men: H('Mentorship'), lead: H('Leadership') };
        ['cult', 'mes', 'ret', 'eng', 'men', 'lead'].forEach(function (k) { show(k, M[k], k === 'mes' ? RED : k === 'cult' || k === 'ret' ? GREY : YEL, L[k]); T[k].style.opacity = .35; });
      }
    },
    {
      t: 'the cockpit', cap: '<p>Put together, the plan becomes the product. <strong>One screen</strong>: the score in the middle, the factors around it, AI insights on top, and every number compared with the industry.</p>',
      set: function () {
        logo.style.opacity = 1;
        Object.keys(F).forEach(function (k) { show(k, F[k], WHITE, ''); });
        setTimeout(function () { if (cur === 8) shots[0].classList.add('on'); }, 650);
      }
    },
    {
      t: 'the explorers', cap: '<p>Each headline number opens into an <strong>explorer</strong>, built the same way: the distribution across groups, the change since the last survey, and the factors underneath.</p><p>Managerial effectiveness, culture and retention.</p>',
      set: function () { cycle([1, 2, 3]); }
    },
    {
      t: 'focus', cap: '<p>And every group opens into a <strong>focus view</strong>: the star performers by level and region, what drives them, what holds them back, and what AI noticed in their teams.</p><p>From one number to the people behind it, in three clicks.</p>',
      set: function () { shots[4].classList.add('on'); }
    }
  ];

  /* ---------------- Engine ---------------- */
  var used;
  function show(k, r, bg, html) {
    var t = T[k]; used[k] = 1;
    place(t, r); t.style.opacity = 1; t.style.backgroundColor = bg;
    if (html !== null && html !== undefined && t._html !== html) {
      var inn = t._in; inn.classList.add('fade');
      setTimeout(function () { inn.innerHTML = html; inn.classList.remove('fade'); }, t._html === undefined ? 0 : 300);
      t._html = html;
    }
  }
  var cyc;
  function cycle(list) {
    var i = 0; shots[list[0]].classList.add('on');
    cyc = setInterval(function () { shots[list[i]].classList.remove('on'); i = (i + 1) % list.length; shots[list[i]].classList.add('on'); }, 2600);
  }
  function reset() {
    used = {};
    clearInterval(cyc);
    shots.forEach(function (s) { s.classList.remove('on'); });
    logo.style.opacity = 0;
    segs.forEach(function (s) { place(s, M.mes); s.style.opacity = 0; });
    cells.forEach(function (cl) { place(cl, [50, 55, .5, .5]); cl.style.opacity = 0; });
    rlabels.concat(clabels).forEach(function (l) { l.style.opacity = 0; });
  }
  function hideUnused(prevRects) {
    Object.keys(T).forEach(function (k) { if (!used[k]) { T[k].style.opacity = 0; } });
  }

  var cur = -1, capEl = document.getElementById('cap'), prog = document.getElementById('prog');
  scenes.forEach(function (s, i) {
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + s.t);
    b.addEventListener('click', function () { go(i); }); prog.appendChild(b);
  });

  function go(i) {
    i = Math.max(0, Math.min(scenes.length - 1, i));
    if (i === cur) return;
    var first = cur === -1; cur = i;
    reset();
    // Explorer/focus scenes keep the cockpit tiles under the screenshots
    if (i >= 8) { logo.style.opacity = 1; Object.keys(F).forEach(function (k) { show(k, F[k], WHITE, ''); }); }
    if (i < 1) { dots.forEach(function (d) { d.style.opacity = 1; }); } else { dots.forEach(function (d) { d.style.opacity = 0; }); }
    scenes[i].set();
    hideUnused();
    if (i < 8 && i !== 1 && i !== 0) {} // tiles already set
    if (i === 0) Object.keys(T).forEach(function (k) { place(T[k], CENTER); T[k].style.opacity = 0; });
    // caption
    capEl.classList.add('out');
    setTimeout(function () {
      capEl.innerHTML = '<div class="step">' + String(i + 1).padStart(2, '0') + ' / ' + scenes.length + '</div><h1>' + scenes[i].t + '</h1>' + scenes[i].cap;
      capEl.classList.remove('out');
    }, first ? 0 : 250);
    Array.prototype.forEach.call(prog.children, function (b, j) { b.className = j < i ? 'done' : j === i ? 'cur' : ''; });
    document.getElementById('prev').style.visibility = i === 0 ? 'hidden' : 'visible';
    document.getElementById('next').textContent = i === scenes.length - 1 ? 'Back to the case study →' : 'Next →';
  }

  // initial tile positions (collapsed in the centre, invisible)
  Object.keys(T).forEach(function (k) { place(T[k], CENTER); T[k].style.opacity = 0; });
  reset();
  go(0);

  /* ---------------- Controls ---------------- */
  function next() { if (cur === scenes.length - 1) { location.href = '/work/gmi/'; return; } go(cur + 1); }
  function prev() { go(cur - 1); }
  document.getElementById('next').addEventListener('click', function () { stopAuto(); next(); });
  document.getElementById('prev').addEventListener('click', function () { stopAuto(); prev(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); stopAuto(); if (cur < scenes.length - 1) go(cur + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); stopAuto(); prev(); }
  });
  var wheelLock = 0;
  window.addEventListener('wheel', function (e) {
    if (innerWidth <= 860) return;
    var now = Date.now(); if (now < wheelLock || Math.abs(e.deltaY) < 12) return;
    wheelLock = now + 950; stopAuto();
    if (e.deltaY > 0) { if (cur < scenes.length - 1) go(cur + 1); } else prev();
  }, { passive: true });
  var sx = null;
  stage.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) { stopAuto(); if (dx < 0) { if (cur < scenes.length - 1) go(cur + 1); } else prev(); }
  });
  var autoT = null, autoBtn = document.getElementById('auto');
  function stopAuto() { if (autoT) { clearInterval(autoT); autoT = null; autoBtn.textContent = 'Autoplay'; } }
  autoBtn.addEventListener('click', function () {
    if (autoT) { stopAuto(); return; }
    autoBtn.textContent = 'Pause';
    autoT = setInterval(function () { if (cur < scenes.length - 1) go(cur + 1); else stopAuto(); }, 6000);
  });
  if (/[?&]autoplay/.test(location.search)) autoBtn.click();
  window.__go = go;

  /* theme toggle (same as the rest of the site) */
  var b = document.querySelector('.theme'), root = document.documentElement;
  function curT() { return root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  function label() { var n = curT() === 'dark' ? 'light' : 'dark'; b.textContent = n === 'dark' ? 'Dark' : 'Light'; }
  b.addEventListener('click', function () { var n = curT() === 'dark' ? 'light' : 'dark'; root.dataset.theme = n; try { localStorage.setItem('theme', n); } catch (e) {} label(); });
  label();
})();
</script>
<script src="/assets/favicon.js" defer></script>
</body>
